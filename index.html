<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Pweedy | Official Hub</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #9b51e0;
            --bg: #0a0f1d;
            --card-bg: #131b2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.15);
            text-align: center;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--text);
        }
        .badge {
            display: inline-block;
            background: rgba(155, 81, 224, 0.2);
            color: #d6bcfa;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(155, 81, 224, 0.3);
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.1), rgba(155, 81, 224, 0.1));
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }
        .menu-item:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
            border-color: transparent;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Miss Pweedy" class="profile-img">
        <h1>Miss Pweedy</h1>
        <div class="badge">Official Content Menu</div>
        <div class="menu">
            <a href="https://wa.me/27835052798?text=Hi%20Miss%20Pweedy,%20I%20want%20to%20chat!" class="menu-item" target="_blank">Direct WhatsApp Chat</a>
            <a href="https://wa.me/27835052798?text=Hi%20Miss%20Pweedy,%20here%20is%20my%20payment%20slip." class="menu-item" target="_blank">Send Payment Slip / Document</a>
            <a href="https://wa.me/27835052798?text=Hi%20Miss%20Pweedy,%20I%20want%20to%20book%20a%20promo." class="menu-item" target="_blank">Book Content Promotion</a>
        </div>
        <div class="footer">Powered by Your Web Agency</div>
    </div>
</body>
</html>
